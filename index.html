<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Wallpaper Extractor</title>
<style>
  body { font-family: Segoe UI, sans-serif; background: #1e1e1e; color: #eee; padding: 16px; margin: 0; }
  h2 { margin-top: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  h2 .badge { font-size: 10px; background: #2e7d32; padding: 2px 8px; border-radius: 10px; font-weight: normal; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .row label { width: 110px; font-size: 13px; flex-shrink: 0; }
  input[type=text] { flex: 1; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #eee; }
  button { padding: 6px 12px; border-radius: 4px; border: none; background: #3a3a3a; color: #eee; cursor: pointer; }
  button:hover { background: #4a4a4a; }
  #extractBtn { background: #2e7d32; font-weight: bold; width: 100%; padding: 10px; margin: 8px 0; }
  #extractBtn:hover { background: #388e3c; }
  #extractBtn:disabled { background: #555; cursor: not-allowed; }
  #openOutBtn { background: #1565c0; font-weight: bold; width: 100%; padding: 8px; margin-bottom: 6px; display: none; }
  #openOutBtn:hover { background: #1976d2; }
  progress { width: 100%; height: 14px; }
  #log { background: #0d0d0d; color: #4caf50; font-family: Consolas, monospace; font-size: 11px;
         height: 100px; overflow-y: auto; padding: 6px; border-radius: 4px; white-space: pre-wrap; margin-top: 6px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 13px; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; height: 240px;
          overflow-y: auto; background: #151515; padding: 8px; border-radius: 4px; }
  .card { background: #2a2a2a; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; position: relative; }
  .card.selected { border-color: #4caf50; }
  .card img { width: 100%; height: 70px; object-fit: cover; display: block; background: #111; }
  .card .noimg { width: 100%; height: 70px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 11px; }
  .card .title { font-size: 10px; padding: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .check { position: absolute; top: 4px; right: 4px; }
</style>
</head>
<body>
  <h2>Wallpaper Engine PKG Extractor <span class="badge">Standalone</span></h2>

  <div class="row">
    <label>Pasta workshop</label>
    <input type="text" id="srcPath" />
    <button id="btnFolder">Mudar</button>
    <button id="btnScan">Buscar</button>
  </div>

  <div class="row">
    <label>Saida</label>
    <input type="text" id="outPath" placeholder="pasta de saida" />
    <button id="btnOut">...</button>
  </div>

  <div class="row">
    <label>Redimensionar</label>
    <select id="resSelect" style="flex:1; padding:6px; border-radius:4px; border:1px solid #444; background:#2a2a2a; color:#eee;">
      <option value="original">Original (Não redimensionar)</option>
      <option value="1920">1080p (FHD - largura 1920px)</option>
      <option value="2560">1440p (QHD - largura 2560px)</option>
      <option value="3840">4K (UHD - largura 3840px)</option>
    </select>
  </div>

  <div class="toolbar">
    <span id="countLabel">0 encontrado(s)</span>
    <span>
      <button id="btnAll">Selecionar todos</button>
      <button id="btnNone">Limpar</button>
    </span>
  </div>

  <div id="grid"></div>

  <button id="extractBtn">Extrair selecionados</button>
  <button id="openOutBtn">📂 Abrir pasta de saida</button>
  <progress id="progress" value="0" max="1"></progress>
  <div id="log"></div>

  <script src="renderer.js"></script>
</body>
</html>
